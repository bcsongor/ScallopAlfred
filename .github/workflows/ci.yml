name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The desktop tests drive the real Electron app, and only Windows has been tested.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
