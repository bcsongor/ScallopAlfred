<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'none'">
  <title>Scallop Alfred</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <main>
    <div class="overlay-heading">
      <header><span class="brand"><img src="../assets/scallop.jpg" width="24" height="24" alt="">Scallop Alfred</span><button id="hide" type="button" title="Hide overlay">Hide</button></header>
      <div class="thread-heading"><button id="back" type="button" aria-label="Back to threads" title="All threads">←</button><h1 id="title">Ask about World of Warcraft</h1><input id="title-editor" type="text" aria-label="Thread title" placeholder="Leave empty to let Codex name it" maxlength="200" hidden></div>
    </div>
    <div id="answer" role="log" aria-label="Thread">Press Alt+Q in WoW to ask a question. Hover a tooltip first or Shift-click a link into the question box, then copy the request.</div>
    <footer>
      <div id="followup-bar"><button id="followup" type="button" hidden>Follow up</button></div>
      <form id="followup-form" hidden>
        <textarea id="question" aria-label="Follow-up question" placeholder="Ask a follow-up…" maxlength="2000"></textarea>
        <div class="form-actions"><span>Enter to send</span><button id="cancel-followup" type="button">Cancel</button><button id="send-followup" type="submit" disabled>Send</button></div>
      </form>
    </footer>
  </main>
  <div id="resize-height" title="Drag to resize height"></div>
  <template id="unarchive-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v5H3zM5 8v13h14V8M12 18v-7M9 14l3-3 3 3"/></svg></template>
  <template id="delete-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></template>
  <template id="archive-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v5H3zM5 8v13h14V8M10 12h4"/></svg></template>
</body>
</html>
