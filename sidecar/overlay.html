<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'none'">
  <title>Scallop Alfred</title>
  <style>
    * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--border) var(--panel); }
    :root {
      color-scheme: dark;
      --font: "Berkeley Mono", "Berkeley Mono Variable", monospace;
      --code-font: "Berkeley Mono", "Berkeley Mono Variable", monospace;
      --text: #f0f0f0; --panel: #191b20; --header-bg: #292c32; --border: #666;
      --button-bg: #292c32; --button-hover: #41454d; --muted: #b9bbc9;
      --archive-text: #999; --archive-hover: #ccc; --divider: #444;
      --response-text: #cdd0d5; --strong: #fff; --heading: var(--text);
      --question-bg: #25303f; --question-text: #c4dcf5; --error: #ffb5a7;
      --link: #a8ceff; --code-bg: #30343b; --quote: #c8cbd1;
      --table-border: #555; --input-border: #777; --input-bg: #101216;
    }
    :root[data-theme="wowhead"] {
      --font: Arial, Helvetica, sans-serif;
      --code-font: Consolas, "Courier New", monospace;
      --text: #eee; --panel: #101010; --header-bg: #202020; --border: #484848;
      --button-bg: #303030; --button-hover: #404040; --muted: #aaa;
      --divider: #383838; --response-text: #bbb; --heading: #ffd100;
      --question-bg: #2b211e; --question-text: #f0d5ac;
      --link: #ffd100; --code-bg: #292929; --quote: #bbb;
      --table-border: #444; --input-border: #666; --input-bg: #181818;
    }
    :root[data-theme="wowhead"] main { font-size: calc(1em + 1px); }
    :root[data-theme="wowhead"] :is(header, footer) { font-size: 14px; }
    :root[data-theme="wowhead"] :is(.conversation-preview, .conversation time) { font-size: 13px; }
    :root[data-theme="wowhead"] :is(#followup, .form-actions button[type="submit"]) { background: #a71a19; border-color: #bd4035; color: #fff; }
    :root[data-theme="wowhead"] :is(#followup, .form-actions button[type="submit"]):hover { background: #8c1515; }
    #title, .conversation-title, .response :is(h1, h2, h3, h4, h5, h6) { color: var(--heading); }
    html, body { height: 100%; margin: 0; }
    body { padding: 4px; color: var(--text); background: transparent; font: 14px/1.5 var(--font); }
    main { height: 100%; display: flex; flex-direction: column; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .overlay-heading { display: flex; flex-direction: column; flex-shrink: 0; margin: -12px -14px 0; padding: 12px 14px 0; background: var(--header-bg); box-shadow: 0 4px 8px -2px #0009; position: relative; z-index: 1; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text); font-size: 13px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 8px; font: 400 20px/1.3 "Arial Narrow", "Roboto Condensed", Arial, sans-serif; white-space: nowrap; flex-shrink: 0; }
    button { flex-shrink: 0; padding: 5px 9px; border: 1px solid var(--border); border-radius: 3px; background: var(--button-bg); color: var(--text); font: inherit; cursor: pointer; }
    button:hover { background: var(--button-hover); }
    button:disabled { opacity: 0.5; cursor: default; }
    [hidden] { display: none !important; }
    .conversation-heading { display: flex; align-items: center; gap: 8px; margin: 14px 0 10px; flex-shrink: 0; }
    #title { font-size: 1em; font-weight: 700; margin: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .conversation-row { position: relative; margin-bottom: 8px; }
    .conversation { display: block; width: 100%; padding: 10px 42px 10px 10px; text-align: left; }
    .archive-conversation { position: absolute; top: 7px; right: 7px; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border-color: transparent; background: transparent; color: var(--muted); }
    .archive-conversation:hover { color: var(--text); background: var(--button-hover); }
    .active-conversations { flex: 1; min-height: 0; overflow-y: auto; }
    .archived-conversations { flex-shrink: 0; max-height: 50%; overflow-y: auto; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--divider); color: var(--archive-text); }
    #answer .archived-conversations h2 { margin: 0 0 6px; color: var(--archive-text); font-weight: 700; }
    .archived-conversation { display: block; width: 100%; padding: 5px 0; border: 0; background: transparent; color: var(--archive-text); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .archived-conversation:hover { background: transparent; color: var(--archive-hover); }
    .conversation-title, .conversation-preview { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .conversation-preview, .conversation time { color: var(--muted); font-size: 12px; }
    .conversation time { display: block; margin-top: 6px; }
    #answer { margin: 0; overflow-wrap: anywhere; overflow-y: auto; flex: 1; min-height: 0; }
    body[data-status="history"] #answer { display: flex; flex-direction: column; overflow: hidden; }
    .turn:first-child, #answer > .notice:first-child { padding-top: 10px; }
    .turn + .turn { margin-top: 16px; }
    .question, .response { text-align: left; }
    .response { color: var(--response-text); }
    .response strong { color: var(--strong); }
    .response a strong { color: inherit; }
    .question { margin-bottom: 10px; padding: 6px 8px; border-radius: 3px; background: var(--question-bg); color: var(--question-text); white-space: pre-wrap; }
    .notice, .turn:not([data-status="answer"]) .response { white-space: pre-wrap; }
    .turn[data-status="thinking"] .response { color: var(--muted); }
    .turn[data-status="error"] .response { color: var(--error); }
    .response > :first-child { margin-top: 0; }
    .response > :last-child { margin-bottom: 0; }
    #answer p, #answer ul, #answer ol, #answer pre, #answer blockquote, #answer table { margin: 0 0 12px; }
    #answer :is(h1, h2, h3, h4, h5, h6) { font-size: 1em; margin: 16px 0 8px; }
    #answer ul, #answer ol { padding-left: 24px; }
    #answer a { color: var(--link); text-decoration: none; }
    #answer a:hover { color: var(--strong); }
    .favicon { width: 16px; height: 16px; margin-right: 4px; vertical-align: -3px; }
    #answer code { padding: 1px 3px; background: var(--code-bg); }
    #answer pre { padding: 8px; background: var(--code-bg); white-space: pre-wrap; }
    #answer pre code { padding: 0; }
    #answer blockquote { padding-left: 10px; border-left: 2px solid var(--border); color: var(--quote); }
    #answer table { display: block; overflow-x: auto; overflow-wrap: normal; border-collapse: collapse; }
    #answer th, #answer td { padding: 4px 8px; border: 1px solid var(--table-border); text-align: left; }
    footer { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--divider); font-size: 13px; color: var(--muted); flex-shrink: 0; }
    footer:has(#followup[hidden]):has(#followup-form[hidden]) { display: none; }
    #followup-bar, .form-actions { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    #followup-bar { white-space: nowrap; }
    #question { display: block; width: 100%; height: 76px; resize: none; margin-bottom: 8px; padding: 7px; border: 1px solid var(--input-border); border-radius: 3px; background: var(--input-bg); color: var(--text); font: inherit; }
    .form-actions { justify-content: flex-end; }
    #resize-height { position: fixed; bottom: 4px; left: 4px; right: 4px; height: 10px; cursor: ns-resize; touch-action: none; }
    #resize-height::after { content: ""; display: block; width: 32px; height: 2px; margin: 4px auto; background: var(--border); border-radius: 1px; }
    #resize-height:hover::after { background: var(--text); }
    code { font: inherit; font-family: var(--code-font); color: var(--text); }
  </style>
</head>
<body>
  <main>
    <div class="overlay-heading">
      <header><span class="brand"><img src="../assets/scallop.jpg" width="24" height="24" alt="">Scallop Alfred</span><button id="hide" type="button" title="Hide overlay">Hide</button></header>
      <div class="conversation-heading"><button id="back" type="button" aria-label="Back to threads" title="All threads">←</button><h1 id="title">Ask about World of Warcraft</h1></div>
    </div>
    <div id="answer" role="log" aria-label="Thread">Press Alt+Q in WoW to ask a question. Hover a tooltip first or Shift-click a link into the question box, then copy the request.</div>
    <footer>
      <div id="followup-bar"><button id="followup" type="button" disabled hidden>Follow up</button></div>
      <form id="followup-form" hidden>
        <textarea id="question" aria-label="Follow-up question" placeholder="Ask a follow-up…" maxlength="2000" required></textarea>
        <div class="form-actions"><span>Enter to send</span><button id="cancel-followup" type="button">Cancel</button><button type="submit">Send</button></div>
      </form>
    </footer>
  </main>
  <div id="resize-height" title="Drag to resize height"></div>
  <template id="archive-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v5H3zM5 8v13h14V8M10 12h4"/></svg></template>
</body>
</html>
